name: Auto-add to shared project

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  add-to-board:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue or PR to the project board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          BOARD: ${{ secrets.PROJECT_BOARD_ID }}
          CONTENT: ${{ github.event.issue.node_id || github.event.pull_request.node_id }}
        run: |
          gh api graphql \
            -f query='mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: { projectId: $project, contentId: $content }) {
                item { id }
              }
            }' \
            -f project="$BOARD" \
            -f content="$CONTENT"
